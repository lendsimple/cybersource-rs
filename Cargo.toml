[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "cybersource"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Idiomatic Rust client for the Cybersource REST API (async, blocking and WebAssembly)"
keywords = ["cybersource", "payments", "visa", "api", "client"]
categories = ["api-bindings", "web-programming::http-client", "wasm"]
readme = "README.md"
exclude = ["/spec", "/xtask", "/tests", "/.github", "/implementation.md"]

[features]
default = ["server", "reqwest", "rustls", "payments", "tms", "capture-context"]
# Credentialed client: auth, keys, operations. Never enable in browser builds.
server = []
# Legacy HTTP Signature auth. Cybersource retires it in March 2027; prefer JWT.
http-signature = ["server"]
reqwest = ["server", "dep:reqwest"]
ureq = ["server", "dep:ureq"]
rustls = ["reqwest?/rustls", "ureq?/rustls"]
native-tls = ["reqwest?/native-tls", "ureq?/native-tls"]

# API groups (see spec/codegen.toml [groups]); each is `client.<group>()`.
account-updater = ["server"]
agentic-commerce = ["server"]
bank-account-validation = ["server"]
bin-lookup = ["server"]
boarding = ["server"]
capture-context = ["server"]
currency-conversion = ["server"]
devices = ["server"]
invoicing = ["server"]
payments = ["server"]
payouts = ["server"]
recurring-billing = ["server"]
reporting = ["server"]
risk = ["server"]
secure-file-share = ["server"]
tax = ["server"]
tms = ["server"]
transactions = ["server"]
user-management = ["server"]
webhooks = ["server"]
# Every API group, plus every auth option.
full = [
    "account-updater",
    "agentic-commerce",
    "bank-account-validation",
    "bin-lookup",
    "boarding",
    "capture-context",
    "currency-conversion",
    "devices",
    "invoicing",
    "payments",
    "payouts",
    "recurring-billing",
    "reporting",
    "risk",
    "secure-file-share",
    "tax",
    "tms",
    "transactions",
    "user-management",
    "webhooks",
    "http-signature",
]

[package.metadata.docs.rs]
features = ["full", "reqwest", "ureq"]

[dependencies]
bytes = "1.12"
http = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
web-time = "1.1"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, optional = true }
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
secrecy = "0.10"
zeroize = "1.9"
x509-cert = { version = "0.3", features = ["pem"] }
der = "0.8"
rsa = { version = "0.10", features = ["pkcs1v15"] }
pkcs8 = { version = "0.11", features = ["pem"] }
pkcs1 = { version = "0.8", features = ["pem"] }
bon = "3.10"
httpdate = "1.0"
percent-encoding = "2.3"

# Blocking transport; meaningless on wasm, where nothing may block.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "3.5", default-features = false, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
