[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "cybersource"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Idiomatic Rust client for the Cybersource REST API (async, blocking and WebAssembly)"
keywords = ["cybersource", "payments", "visa", "api", "client"]
categories = ["api-bindings", "web-programming::http-client", "wasm"]
readme = "README.md"
repository = "https://github.com/lendsimple/cybersource-rs"
documentation = "https://docs.rs/cybersource"
exclude = [
    "/spec",
    "/xtask",
    "/scripts",
    "/.github",
    "/.cargo",
    "/implementation.md",
    "/RELEASING.md",
    "/deny.toml",
]

[features]
default = ["server", "reqwest", "rustls", "p12", "payments", "tms", "capture-context"]
# Credentialed client: auth, keys, operations. Leave it off in builds that
# ship to end users (Flex tokenization in `flex` needs no features).
server = ["dep:regex"]
# Legacy HTTP Signature auth. Cybersource retires it in March 2027; prefer JWT.
http-signature = ["server"]
reqwest = ["server", "dep:reqwest"]
ureq = ["server", "dep:ureq"]
rustls = ["reqwest?/rustls", "ureq?/rustls"]
native-tls = ["reqwest?/native-tls", "ureq?/native-tls"]
# Structured request logging via `tracing`, with PII redacted.
tracing = ["server", "dep:tracing"]
# Async transport over the JavaScript `fetch` API (wasm32): Cloudflare
# Workers, Deno and Node.
fetch = ["server", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
# Async transport over WASI 0.2 HTTP (wasm32-wasip2). Needs Rust 1.91.1 (wstd).
wasi = ["server", "dep:wstd"]
# Convert rust_decimal::Decimal into Amount.
rust_decimal = ["dep:rust_decimal"]
# PKCS#12 (.p12) key loading.
p12 = ["server", "dep:p12-keystore"]

# API groups (see spec/codegen.toml [groups]); each is `client.<group>()`.
account-updater = ["server"]
agentic-commerce = ["server"]
bank-account-validation = ["server"]
bin-lookup = ["server"]
boarding = ["server"]
capture-context = ["server"]
currency-conversion = ["server"]
devices = ["server"]
invoicing = ["server"]
payments = ["server"]
payouts = ["server"]
recurring-billing = ["server"]
reporting = ["server"]
risk = ["server"]
secure-file-share = ["server"]
tax = ["server"]
tms = ["server"]
transactions = ["server"]
user-management = ["server"]
webhooks = ["server"]
# Every API group, plus every auth option.
full = [
    "account-updater",
    "agentic-commerce",
    "bank-account-validation",
    "bin-lookup",
    "boarding",
    "capture-context",
    "currency-conversion",
    "devices",
    "invoicing",
    "payments",
    "payouts",
    "recurring-billing",
    "reporting",
    "risk",
    "secure-file-share",
    "tax",
    "tms",
    "transactions",
    "user-management",
    "webhooks",
    "http-signature",
    "p12",
    "tracing",
]

[package.metadata.docs.rs]
features = ["full", "reqwest", "ureq"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bytes = "1.12.2"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
web-time = "1.1.0"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, optional = true }
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.1"
secrecy = "0.10.3"
zeroize = "1.9.2"
x509-cert = { version = "0.3.1", features = ["hazmat", "pem"] }
der = "0.8.3"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
pkcs8 = { version = "0.11.0", features = ["encryption", "pem"] }
pkcs1 = { version = "0.8.0", features = ["pem"] }
bon = "3.10.3"
httpdate = "1.0.3"
percent-encoding = "2.3.2"
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode-perl"], optional = true }
p12-keystore = { version = "0.4.1", optional = true }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
sha1 = { version = "0.11.0", default-features = false }
rust_decimal = { version = "1.43.0", optional = true }
subtle = "2.6.1"
tracing = { version = "0.1.44", optional = true }

# Blocking transport; meaningless on wasm, where nothing may block.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "3.5.2", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.107", optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
web-sys = { version = "0.3.107", optional = true, features = [
    "Headers", "Request", "RequestInit", "Response", "WorkerGlobalScope",
] }

[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dependencies]
wstd = { version = "0.6.8", default-features = false, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }

# Native-only test tooling (tokio networking, compile-fail tests, snapshots).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
trybuild = "1.0.125"
wiremock = "0.6.5"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dev-dependencies]
wstd = { version = "0.6.8", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "authorize_and_capture"
required-features = ["reqwest", "payments"]

[[example]]
name = "blocking"
required-features = ["ureq", "payments"]

[[example]]
name = "tms_customer"
required-features = ["reqwest", "tms"]

[[example]]
name = "capture_context"
required-features = ["reqwest", "capture-context"]

[[example]]
name = "webhook"
