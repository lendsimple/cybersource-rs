[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
heck = "0.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syn = { version = "3.0.10", features = ["full"] }
toml = "1.2.1"

[dev-dependencies]
insta = "1.49.0"
