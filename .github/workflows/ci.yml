name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Reduced feature sets catch code (and test helpers) only used by some features.
      - run: cargo clippy --package cybersource --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --package cybersource --all-targets --no-default-features --features server -- -D warnings
      - run: cargo clippy --package cybersource --all-targets --no-default-features --features p12 -- -D warnings
      - run: cargo clippy --package cybersource --all-targets --no-default-features --features tracing -- -D warnings
      - run: cargo doc --package cybersource --features full --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask verify-spec
      - run: cargo xtask check-codegen

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --all-features
      - run: cargo build --examples --all-features

  # Each API group must build on its own: catches cfg mistakes in shared models.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - account-updater
          - agentic-commerce
          - bank-account-validation
          - bin-lookup
          - boarding
          - capture-context
          - currency-conversion
          - devices
          - invoicing
          - payments
          - payouts
          - recurring-billing
          - reporting
          - risk
          - secure-file-share
          - tax
          - tms
          - transactions
          - user-management
          - webhooks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package cybersource --no-default-features --features ${{ matrix.group }}

  build-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clean build of the full API surface
        run: |
          cargo fetch
          start=$(date +%s)
          cargo build --package cybersource --features full
          echo "### Clean \`--features full\` build: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package cybersource --features full,ureq

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130,wasmtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo check --package cybersource --target wasm32-unknown-unknown --no-default-features --features server,reqwest
      - run: cargo check --package cybersource --target wasm32-unknown-unknown --all-features
      - run: cargo check --package cybersource --target wasm32-wasip2 --no-default-features --features server,payments,p12
      # Run the core on real wasm runtimes: Node (wasm-bindgen-test) and wasmtime.
      - run: cargo clippy --package cybersource --all-targets --target wasm32-unknown-unknown --no-default-features --features server,payments,http-signature,fetch -- -D warnings
      - run: cargo clippy --package cybersource --all-targets --target wasm32-wasip2 --no-default-features --features server,payments,http-signature,wasi -- -D warnings
      - run: cargo test --package cybersource --target wasm32-unknown-unknown --no-default-features --features server,payments,http-signature,fetch --test wasm --test flex
      - run: cargo test --package cybersource --target wasm32-wasip2 --no-default-features --features server,payments,http-signature,wasi --test wasm --test flex --test dsl --test spec_examples
