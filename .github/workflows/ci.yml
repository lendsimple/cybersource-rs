name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Reduced feature sets catch code (and test helpers) only used by some
        # features, and the client's default transport type parameters.
        features:
          - --workspace --all-features
          - --package cybersource --no-default-features
          - --package cybersource --no-default-features --features server
          - --package cybersource --no-default-features --features p12
          - --package cybersource --no-default-features --features tracing
          - --package cybersource --no-default-features --features ureq,rustls,payments
          - --package cybersource --no-default-features --features reqwest,native-tls,payments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask verify-spec
      - run: cargo xtask check-codegen

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --all-features
      - run: cargo build --examples --all-features

  # Each API group must build on its own: catches cfg mistakes in shared models.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - account-updater
          - agentic-commerce
          - bank-account-validation
          - bin-lookup
          - boarding
          - capture-context
          - currency-conversion
          - devices
          - invoicing
          - payments
          - payouts
          - recurring-billing
          - reporting
          - risk
          - secure-file-share
          - tax
          - tms
          - transactions
          - user-management
          - webhooks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --package cybersource --no-default-features --features ${{ matrix.group }}

  build-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - name: Clean build of the full API surface
        run: |
          cargo fetch
          start=$(date +%s)
          cargo build --package cybersource --features full
          echo "### Clean \`--features full\` build: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo +1.88 check --package cybersource --features full,ureq

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "nightly"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: minimal-versions
      # Resolve each direct dependency to the lowest version its requirement allows,
      # so the floors in the manifests stay honest. Only the resolution needs
      # nightly; the tests run on stable.
      - run: cargo +nightly update -Z direct-minimal-versions
      - run: cargo +stable test --workspace --all-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          targets: wasm32-unknown-unknown, wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: wasm-bindgen-cli@0.2.130,wasmtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo check --package cybersource --target wasm32-unknown-unknown --no-default-features --features server,reqwest
      - run: cargo check --package cybersource --target wasm32-unknown-unknown --all-features
      - run: cargo check --package cybersource --target wasm32-wasip2 --no-default-features --features server,payments,p12
      # Run the core on real wasm runtimes: Node (wasm-bindgen-test) and wasmtime.
      - run: cargo clippy --package cybersource --all-targets --target wasm32-unknown-unknown --no-default-features --features server,payments,http-signature,fetch -- -D warnings
      - run: cargo clippy --package cybersource --all-targets --target wasm32-wasip2 --no-default-features --features server,payments,http-signature,wasi -- -D warnings
      - run: cargo test --package cybersource --target wasm32-unknown-unknown --no-default-features --features server,payments,http-signature,fetch --test wasm --test flex
      - run: cargo test --package cybersource --target wasm32-wasip2 --no-default-features --features server,payments,http-signature,wasi --test wasm --test flex --test dsl --test spec_examples

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --package cybersource --features full --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  docs-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "nightly"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # As docs.rs builds the docs: the features in [package.metadata.docs.rs],
      # nightly, `--cfg docsrs`.
      - run: cargo doc --package cybersource --no-deps --features full,reqwest,ureq
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo publish --dry-run --package cybersource

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
